# Defaults for the local docker compose stack (SPRING_PROFILES_ACTIVE=docker).
# Every value can be overridden through environment variables, e.g. in the .env file.
app:
  security:
    admin:
      password: ${APP_ADMIN_PASSWORD:{noop}admin}
    jwt:
      secret: ${APP_JWT_SECRET:docker-compose-local-secret-change-me-please}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
