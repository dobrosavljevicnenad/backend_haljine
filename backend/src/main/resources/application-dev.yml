# Local development profile: activate with SPRING_PROFILES_ACTIVE=dev
# Expects the database from `docker compose up -d db` (published on localhost:5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dress_inventory}

logging:
  level:
    io.github.dobrosavljevicnenad.dressinventory: DEBUG
    org.hibernate.SQL: DEBUG

# Local-only credentials. Production values come from environment variables.
app:
  security:
    admin:
      password: "{noop}admin"
    jwt:
      secret: local-development-secret-do-not-use-in-production
