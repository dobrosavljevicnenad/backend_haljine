spring:
  application:
    name: dress-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dress_inventory}
    username: ${DB_USERNAME:dress}
    password: ${DB_PASSWORD:dress}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      # Use a bcrypt hash in production: {bcrypt}$2a$10$...
      password: ${APP_ADMIN_PASSWORD:}
    jwt:
      secret: ${APP_JWT_SECRET:}
      ttl: 2h
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: haljine
