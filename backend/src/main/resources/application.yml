spring:
  application:
    name: dress-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dress_inventory}
    username: ${DB_USERNAME:dress}
    password: ${DB_PASSWORD:dress}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
