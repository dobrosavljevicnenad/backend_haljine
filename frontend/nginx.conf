server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API calls are forwarded to the Spring Boot container: same origin, no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Content-hashed bundles produced by the Angular build can be cached for a long time.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell and service worker files must always be revalidated.
    location ~* (?:index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
